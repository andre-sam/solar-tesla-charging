blueprint:
  name: Solar Tesla Charging
  description: >
    Charges a Tesla on a Wall Connector from your solar surplus
    only, by tracking household consumption and PV output minute by
    minute. Modulates the car's charge current through the Tesla
    integration using the Fleet API's 1 A floor (the Tesla app's
    minimum is 5 A), so the session can run from as little as ~700
    W of surplus on a 3-phase install and ramp continuously up to
    the Wall Connector's maximum as export rises. Reacts to grid
    state changes within seconds rather than at the next minute
    boundary, so brief appliance spikes don't pin the session at
    low current and brief sunny gaps aren't exported.


    Required helpers (create in HA before importing):

      - input_boolean for the master enable toggle
      - input_boolean for the below-minimum tracker (controller
        writes to it; you don't interact with it directly)
      - two input_datetime helpers (time only) for the charging
        window start / end

    Optional helpers (leave the matching inputs blank to skip):

      - input_datetime for fast recovery from import spikes
      - input_boolean as a session start lock to dedupe
        "Solar Charging Started" notifications
      - input_boolean entities for load prioritisation
      - power sensors for deferrable loads (e.g. a myenergi eddi
        diverter) so the Tesla can claim that solar power first
      - Solcast PV Forecast sensors for the forecast boost
      - a notify service for session and lifecycle notifications


    Full documentation:
    https://github.com/andre-sam/solar-tesla-charging

  domain: automation
  source_url: https://github.com/andre-sam/solar-tesla-charging/blob/main/solar_tesla_controller.yaml
  input:
    enable_toggle:
      name: Master enable toggle
      description: >
        Your on/off switch for the whole automation. Flip this off and
        the controller stops doing anything; flip it on and it resumes
        from wherever solar export currently sits. Use it from a
        dashboard, from the app, or from a voice assistant.
      selector:
        entity:
          domain: input_boolean

    below_min_flag:
      name: Below-minimum tracker (input_boolean)
      description: >
        Internal bookkeeping helper. The controller turns this ON
        while solar export is below the minimum charge current and OFF
        as soon as export recovers. If it stays ON for the full grace
        period (see Grace at minimum below), the session is stopped.
        You create it once and don't interact with it.
      selector:
        entity:
          domain: input_boolean

    grid_export_power_negative:
      name: Grid export power sensor (W, negative when exporting)
      description: >
        Power sensor that reads BELOW ZERO when your solar is
        exporting to the grid. Used to know how much surplus is
        available for the car. If your meter reports export the wrong
        way (positive while exporting), wrap it in a template sensor
        that multiplies by -1.
      selector:
        entity:
          domain: sensor
          device_class: power

    grid_import_power:
      name: Grid import power sensor (W, positive when importing)
      description: >
        Power sensor that reads ABOVE ZERO when you're drawing from
        the grid. Some meters (e.g. Enphase) report import and export
        as two separate sensors — point this at the import one. If
        your meter only exposes a single signed sensor, point BOTH
        this and the export input above at it.
      selector:
        entity:
          domain: sensor
          device_class: power

    wall_connector_power:
      name: Wall connector power sensor
      description: >
        Power the wall connector is currently delivering to the car.
        The controller adds this back when working out how much
        surplus solar is really available — without it, the car's own
        draw would make the grid look balanced and the controller
        would refuse to ramp up further.
      selector:
        entity:
          domain: sensor
          device_class: power

    vehicle_connected:
      name: Vehicle connected binary sensor
      description: >
        Binary sensor from the wall connector that's ON when the
        charge cable is plugged into the car. The controller only
        considers charging when this is ON.
      selector:
        entity:
          domain: binary_sensor

    contactor_closed:
      name: Contactor closed binary sensor
      description: >
        Binary sensor that's ON when the wall connector is actively
        passing current to the car. The controller treats this as the
        definitive 'is a session running' signal — more reliable than
        the Tesla integration's own state.
      selector:
        entity:
          domain: binary_sensor

    wall_connector_status:
      name: Wall connector status sensor
      description: >
        Text status from the wall connector (typical values include
        'Charging', 'Connected', 'Fault'). The controller refuses to
        start when this reports a fault, and stops a running session
        if a fault appears mid-charge.
      selector:
        entity:
          domain: sensor

    charge_current_number:
      name: Tesla charge current control (A)
      description: >
        The Tesla integration's amps slider. This is what the
        controller writes to in order to modulate how hard the car
        charges as solar comes and goes through the day.
      selector:
        entity:
          domain: number

    charge_switch:
      name: Tesla charge on/off switch
      description: >
        The Tesla integration's on/off switch for charging. The
        controller turns this on to start a session and off to stop
        one (e.g. at the SOC cap, or when solar runs out).
      selector:
        entity:
          domain: switch

    battery_soc:
      name: Tesla battery SOC sensor (%)
      description: >
        The car's current battery percentage. Drives the stop-at-cap
        logic, the restart-if-drained logic, and the 'charged from X%
        (+Y%)' summary in notifications.
      selector:
        entity:
          domain: sensor

    charge_limit_number:
      name: Tesla charge limit control (optional)
      description: >
        OPTIONAL. The car-side charge limit from the Tesla app
        (READ-ONLY — the controller never changes your app setting).
        When configured, the effective stop point becomes whichever is
        lower: this car-side limit, or the local cap below. Leave
        empty to use only the local cap.
      default: ""
      selector:
        entity:
          domain: number

    wake_button:
      name: Tesla wake-up button (optional)
      description: >
        OPTIONAL but strongly recommended. A button entity from the
        Tesla integration that wakes the car. The controller presses
        it before any start or resume attempt so the car is awake by
        the time the charge command arrives. Without it, restarts can
        silently fail when the car has gone to sleep.
      default: ""
      selector:
        entity:
          domain: button

    line_voltage:
      name: Line voltage (V)
      description: >
        Your supply voltage. 230 V for Australia and most of Europe
        (any number of phases), 240 V for UK or US split-phase, 120 V
        for US single-phase. Used to convert watts of solar export
        into amps the controller can send to the car.
      default: 230
      selector:
        number:
          min: 100
          max: 260
          step: 1
          unit_of_measurement: V

    phase_count:
      name: Number of phases
      description: >
        Number of phases your wall connector is wired to (1, 2, or 3).
        IMPORTANT: this only matters if your grid sensor reports TOTAL
        household power across all phases (typical for whole-house
        meters like Enphase, Powerwall, Shelly EM). If your sensor
        reports just one phase, set this to 1 even on a 3-phase
        install.
      default: 3
      selector:
        number:
          min: 1
          max: 3
          step: 1

    window_start:
      name: Charging window start (input_datetime)
      description: >
        Earliest time of day the controller is allowed to start a
        session. Create a time-only input_datetime helper and expose
        it on a dashboard so you can shift the window without editing
        the automation.
      selector:
        entity:
          domain: input_datetime

    window_end:
      name: Charging window end (input_datetime)
      description: >
        Latest time of day the controller will start a new session. By
        default, an active session is allowed to continue past this
        (so a late-afternoon charge isn't cut off). Use the hard-stop
        toggle below to change that.
      selector:
        entity:
          domain: input_datetime

    hard_stop_at_window_end:
      name: Hard-stop running session at window end
      description: >
        Off (default): a session that started inside the window keeps
        running until the SOC cap or solar runs out, even if that's
        after the window closes. On: the session is forced to stop the
        moment the window closes — useful only if you have strict
        time-of-use restrictions.
      default: false
      selector:
        boolean:

    min_charge_amps:
      name: Minimum charge current (A)
      description: >
        The lowest the controller will set the charge current. Tesla's
        Fleet API allows down to 1 A (~690 W on 3-phase, ~230 W on
        single-phase); the Tesla app forces a 5 A floor. Lower = more
        session runtime on weak solar; higher = closer to what the car
        expects.
      default: 1
      selector:
        number:
          min: 1
          max: 16
          step: 1
          unit_of_measurement: A

    max_charge_amps:
      name: Maximum charge current (A)
      description: >
        Hardware ceiling for the charge current. Set to your wall
        connector's installed circuit rating — typically 16 A on AU/EU
        3-phase, 32–48 A on US single-phase. The controller also
        clamps against the Tesla integration's own max, so the actual
        ceiling is whichever is lower.
      default: 16
      selector:
        number:
          min: 6
          max: 48
          step: 1
          unit_of_measurement: A

    export_threshold_amps:
      name: Export buffer (A per line)
      description: >
        Safety cushion subtracted from available export before
        deciding the charge current. Higher = less chance of brief
        grid imports but slightly less solar captured; 0 = most
        aggressive tracking. Default 1 A per phase ≈ 230 W per phase
        headroom.
      default: 1
      selector:
        number:
          min: 0
          max: 10
          step: 0.5
          unit_of_measurement: A

    restart_hysteresis_amps:
      name: Restart hysteresis (A)
      description: >
        Extra solar headroom required before restarting a session that
        just stopped at the minimum. Prevents the controller from
        oscillating on/off right at the minimum threshold when solar
        hovers around the bare minimum surplus.
      default: 0.5
      selector:
        number:
          min: 0
          max: 2
          step: 0.1
          unit_of_measurement: A

    fast_ramp_headroom_amps:
      name: Fast ramp-up headroom (A)
      description: >
        When solar suddenly jumps far ahead of where the controller is
        currently set (e.g. a cloud clears), it normally ramps up
        gradually at +1 A per minute. If the jump is at least this
        many amps, it leaps to the new target in a single step
        instead. Set very high (e.g. 20) to always crawl up.
      default: 3
      selector:
        number:
          min: 1
          max: 20
          step: 1
          unit_of_measurement: A

    stability_delay_seconds:
      name: Stability delay on ramp-up (s)
      description: >
        How long to pause between successive +1 A ramp-up steps when
        solar is steadily climbing. Longer = gentler on the car and
        contactor; shorter = aggressive tracking of rising solar.
        Skipped automatically right after an import-spike trim so
        recovery is fast.
      default: 60
      selector:
        number:
          min: 0
          max: 180
          step: 5
          unit_of_measurement: s

    post_trim_fast_recovery_seconds:
      name: Post-trim fast-recovery window (s)
      description: >
        After a brief import spike (kettle, oven) trims the charge
        current down, the controller ignores the stability delay for
        this many seconds. Lets the session recover quickly instead of
        being pinned at the post-trim current. Only effective when the
        'Last import-spike trim' helper is configured.
      default: 180
      selector:
        number:
          min: 0
          max: 600
          step: 30
          unit_of_measurement: s

    import_threshold_w:
      name: Import-spike trim threshold (W)
      description: >
        Minimum grid import (in watts) that counts as a real import
        event for the trim logic. Below this, the controller treats it
        as meter noise and ignores it. Default 50 W suits most modern
        meters; raise if you see false trims from background appliance
        jitter.
      default: 50
      selector:
        number:
          min: 10
          max: 500
          step: 10
          unit_of_measurement: W

    import_safety_margin_amps:
      name: Import-spike trim safety margin (A)
      description: >
        Extra amps to subtract on top of the calculated trim during an
        import spike. The trim math already uses ceiling rounding, so
        0 is fine for accurate meters; bump to 1 if your meter is
        noisy and overshoots regularly.
      default: 0
      selector:
        number:
          min: 0
          max: 2
          step: 1
          unit_of_measurement: A

    stop_grace_seconds:
      name: Grace at minimum before stopping (s)
      description: >
        How long to hold the session at minimum amps before giving up
        when solar can't sustain even the minimum. Longer = more
        tolerant of cloud-cover gaps; shorter = quicker to release the
        grid. If solar recovers during this window, the timer aborts
        and the session continues normally.
      default: 180
      selector:
        number:
          min: 30
          max: 900
          step: 30
          unit_of_measurement: s

    max_soc:
      name: Preferred SOC cap (%)
      description: >
        Local stop point — the controller stops solar charging when
        the car reaches this SOC. Enforced LOCALLY only; the car's
        Tesla-app limit is left untouched, so a Supercharger session
        can still charge past this. Effective stop = lower of this and
        the Tesla-app limit (when the car-side limit entity is
        configured).
      default: 90
      selector:
        number:
          min: 50
          max: 100
          step: 1
          unit_of_measurement: "%"

    restart_soc_hysteresis:
      name: Restart SOC hysteresis (%)
      description: >
        After stopping at the cap, the controller won't restart a
        fresh session until SOC drops at least this many points below
        the cap. Prevents tiny relaunches caused by Tesla vampire
        drain slowly bleeding SOC back below the cap on a sunny day.
        Default 2 % suits typical drain rates.
      default: 2
      selector:
        number:
          min: 0
          max: 10
          step: 1
          unit_of_measurement: "%"

    start_verify_seconds:
      name: Start verification timeout (s)
      description: >
        After commanding the car to start charging, the controller
        waits up to this many seconds for the wall connector to
        actually pass current. If it doesn't (silent Tesla API drop,
        car wedged), the controller assumes the start failed,
        suppresses the 'Started' notification, and clears its locks so
        the next minute's evaluation can cleanly retry.
      default: 60
      selector:
        number:
          min: 10
          max: 180
          step: 5
          unit_of_measurement: s

    boost_soc:
      name: Boost SOC cap (%)
      description: >
        Higher stop point used on a 'last sunny day before bad
        weather'. The controller raises the effective cap from the
        regular max to this value when Solcast forecasts a sunny today
        and a poor next few days. Useful for stashing extra charge
        before a wet week. Must be ≥ Preferred SOC cap; also gated by
        the Tesla-app limit. Set equal to the Preferred cap to disable
        boosting.
      default: 90
      selector:
        number:
          min: 50
          max: 100
          step: 1
          unit_of_measurement: "%"

    solcast_today_kwh:
      name: Solcast forecast today (kWh) (optional)
      description: >
        OPTIONAL. Solcast sensor for today's total predicted PV
        production in kWh (typical name
        `sensor.solcast_pv_forecast_forecast_today`). REQUIRED if you
        want the forecast boost feature; leave empty to disable.
      default: ""
      selector:
        entity:
          domain: sensor

    solcast_tomorrow_kwh:
      name: Solcast forecast tomorrow / +1 day (kWh) (optional)
      description: >
        OPTIONAL. Solcast sensor for tomorrow's predicted production.
        REQUIRED for the boost (the controller needs to compare today
        vs upcoming days).
      default: ""
      selector:
        entity:
          domain: sensor

    solcast_day_3_kwh:
      name: Solcast forecast day 3 / +2 days (kWh) (optional)
      description: >
        OPTIONAL further forecast day. NOTE Solcast's naming is off by
        one: `day_3` is +2 days from today, not +3. The lookahead
        reads days in order and stops at the first one you leave
        empty.
      default: ""
      selector:
        entity:
          domain: sensor

    solcast_day_4_kwh:
      name: Solcast forecast day 4 / +3 days (kWh) (optional)
      description: >
        OPTIONAL. +3 days from today (see note on day_3 about Solcast
        naming).
      default: ""
      selector:
        entity:
          domain: sensor

    solcast_day_5_kwh:
      name: Solcast forecast day 5 / +4 days (kWh) (optional)
      description: >
        OPTIONAL. +4 days from today.
      default: ""
      selector:
        entity:
          domain: sensor

    solcast_day_6_kwh:
      name: Solcast forecast day 6 / +5 days (kWh) (optional)
      description: >
        OPTIONAL. +5 days from today.
      default: ""
      selector:
        entity:
          domain: sensor

    solcast_day_7_kwh:
      name: Solcast forecast day 7 / +6 days (kWh) (optional)
      description: >
        OPTIONAL. +6 days from today.
      default: ""
      selector:
        entity:
          domain: sensor

    boost_lookahead_days:
      name: Boost lookahead (days)
      description: >
        How many days ahead to look when deciding if today is the
        'last sunny day before bad weather'. ALL inspected days must
        be at/below the bad-day threshold AND today must be at/above
        the sunny-day threshold for the boost to activate. Capped by
        how many Solcast sensors you configured.
      default: 2
      selector:
        number:
          min: 1
          max: 6
          step: 1
          unit_of_measurement: d

    boost_today_min_kwh:
      name: Boost "sunny today" threshold (kWh)
      description: >
        Today's forecast must be at least this much (in kWh) to count
        as 'sunny enough' to justify boosting the cap. Set to your
        typical good-day production minus a margin (e.g. if a good day
        is 30 kWh, set this to 25).
      default: 25
      selector:
        number:
          min: 1
          max: 200
          step: 1
          unit_of_measurement: kWh

    boost_bad_day_max_kwh:
      name: Boost "bad day" threshold (kWh)
      description: >
        A forecast day counts as 'bad' (and thus worth boosting
        today's charge to compensate) when its forecast is at or below
        this. Set to your typical overcast-day production (usually
        8–12 kWh in temperate climates).
      default: 12
      selector:
        number:
          min: 1
          max: 200
          step: 1
          unit_of_measurement: kWh

    prioritize_load_booleans:
      name: Prioritize Tesla over these loads (optional)
      description: >
        OPTIONAL. List of input_boolean helpers that gate other
        power-hungry automations (AC, pool pump, dryer, etc.). When
        Tesla SOC is below the threshold below, the controller turns
        these OFF so the Tesla gets first claim on solar. They're
        turned back ON when SOC reaches the cap, when the car is
        unplugged, and at window close as a safety net.
      default: []
      selector:
        entity:
          domain: input_boolean
          multiple: true

    prioritize_below_soc:
      name: Prioritize Tesla below SOC (%)
      description: >
        Only pause the other loads while Tesla SOC is below this.
        Above this, the Tesla is 'comfortable enough' and shares solar
        with the other automations normally. Only takes effect when
        the load-priority list above is configured.
      default: 40
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"

    deferrable_load_sensors:
      name: Deferrable load power sensors (optional)
      description: >
        OPTIONAL. List of POWER sensors for loads that yield
        automatically when other consumers ramp up — typically a solar
        diverter (myenergi eddi, Solic 200, etc.) heating your hot
        water from PV surplus. Their consumption counts as headroom
        for the Tesla, so the car can outbid them. Don't use for
        non-yielding loads (kettle, oven) — those won't back off.
        Don't use for diverters wired upstream of the grid CT —
        they're already invisible to the export sensor.
      default: []
      selector:
        entity:
          domain: sensor
          device_class: power
          multiple: true

    home_battery_soc:
      name: Home battery SOC sensor (%) (optional)
      description: >
        OPTIONAL. If you have a hybrid inverter with a house battery
        (Powerwall, Sungrow, BYD, Sigenergy, etc.), point this at the
        battery's SOC sensor. The controller will hold off claiming
        solar for the Tesla until the battery is above the reserve
        below.
      default: ""
      selector:
        entity:
          domain: sensor

    home_battery_reserve_soc:
      name: Home battery reserve SOC (%)
      description: >
        How full the house battery should be before the Tesla starts
        claiming solar. E.g. 80 means 'fill the battery to 80 % first,
        then let the Tesla have whatever's left'. Higher = battery
        gets priority for longer; 0 = no priority (Tesla and battery
        compete normally). Only matters when the sensor above is
        configured.
      default: 0
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"

    session_lock:
      name: Session start lock (optional)
      description: >
        OPTIONAL but recommended. Dedupes 'Solar Charging Started'
        notifications — the controller can evaluate the start logic
        more than once during the 15 s wake delay, and without this
        lock you'd get duplicate notifications. Create an
        input_boolean and point this at it. Auto-clears on contactor
        open, HA restart, or unplug.
      default: ""
      selector:
        entity:
          domain: input_boolean

    session_start_soc:
      name: Session start SOC tracker (optional)
      description: >
        OPTIONAL. Used to add a 'charged from X% (+Y%)' summary to
        session-end notifications. Create an input_number (0–100, step
        1); the controller writes the car's SOC to it at each session
        start and reads it back at the stop. You never interact with
        it manually.
      default: ""
      selector:
        entity:
          domain: input_number

    last_guard_trim:
      name: Last import-spike trim timestamp (optional)
      description: >
        OPTIONAL. Required for the post-trim fast-recovery feature.
        Create an input_datetime (date + time). The controller stamps
        it each time it trims charge current in response to a
        grid-import spike; the timestamp is then used to skip the
        stability delay during the recovery window.
      default: ""
      selector:
        entity:
          domain: input_datetime

    last_ramp_up_at:
      name: Last ramp-up timestamp (optional)
      description: >
        OPTIONAL. Properly rate-limits ramp-up across the controller's
        parallel-execution model. Without this, on a noisy meter the
        controller can sometimes ramp up faster than the stability
        delay would suggest. Create an input_datetime (date + time).
        Leave empty if your meter updates calmly (≤ 1/minute) — the
        basic delay is enough.
      default: ""
      selector:
        entity:
          domain: input_datetime

    boost_session_lock:
      name: Boost session lock (input_boolean, optional)
      description: >
        OPTIONAL but strongly recommended whenever the forecast boost
        is configured. Without it, a brief Solcast 'unavailable'
        mid-day can drop the cap from Boost back to regular and
        immediately end your session at the lower cap. Create an
        input_boolean and the controller will latch it ON at the start
        of a boost session, ignoring forecast changes until the
        session ends.
      default: ""
      selector:
        entity:
          domain: input_boolean

    notify_service:
      name: Notify service (optional)
      description: >
        OPTIONAL. Name of an HA notify service to send session and
        lifecycle events to (e.g. `notify.mobile_app_phone`). Leave
        empty to disable all notifications.
      default: ""
      selector:
        text:

    session_min_gain_for_notify:
      name: Minimum SOC gain for session-end notifications (%)
      description: >
        Suppress session-end notifications when the session didn't
        actually move SOC by at least this much. Stops cloudy-day
        start/stop cycling from spamming your phone with low-value
        'session ended +0.3%' messages. Set to 0 to always notify.
      default: 1
      selector:
        number:
          min: 0
          max: 20
          step: 1
          unit_of_measurement: "%"

mode: parallel
max: 10
max_exceeded: silent

variables:
  enable_toggle: !input enable_toggle
  below_min_flag: !input below_min_flag
  grid_export_power_negative: !input grid_export_power_negative
  grid_import_power: !input grid_import_power
  wall_connector_power: !input wall_connector_power
  vehicle_connected: !input vehicle_connected
  contactor_closed: !input contactor_closed
  wall_connector_status: !input wall_connector_status
  charge_current_number: !input charge_current_number
  charge_switch: !input charge_switch
  battery_soc: !input battery_soc
  charge_limit_number: !input charge_limit_number
  wake_button: !input wake_button
  last_guard_trim: !input last_guard_trim
  notify_service: !input notify_service
  line_voltage: !input line_voltage
  phase_count: !input phase_count
  export_threshold_amps: !input export_threshold_amps
  min_charge_amps_cfg: !input min_charge_amps
  max_charge_amps_cfg: !input max_charge_amps
  restart_hysteresis_amps: !input restart_hysteresis_amps
  fast_ramp_headroom_amps: !input fast_ramp_headroom_amps
  max_soc: !input max_soc
  boost_soc: !input boost_soc
  solcast_today_kwh: !input solcast_today_kwh
  solcast_tomorrow_kwh: !input solcast_tomorrow_kwh
  solcast_day_3_kwh: !input solcast_day_3_kwh
  solcast_day_4_kwh: !input solcast_day_4_kwh
  solcast_day_5_kwh: !input solcast_day_5_kwh
  solcast_day_6_kwh: !input solcast_day_6_kwh
  solcast_day_7_kwh: !input solcast_day_7_kwh
  boost_lookahead_days: !input boost_lookahead_days
  boost_today_min_kwh: !input boost_today_min_kwh
  boost_bad_day_max_kwh: !input boost_bad_day_max_kwh
  stability_delay_seconds: !input stability_delay_seconds
  post_trim_fast_recovery_seconds: !input post_trim_fast_recovery_seconds
  stop_grace_seconds: !input stop_grace_seconds
  import_threshold_w: !input import_threshold_w
  import_safety_margin_amps: !input import_safety_margin_amps
  hard_stop_at_window_end: !input hard_stop_at_window_end
  window_start: !input window_start
  window_end: !input window_end
  prioritize_load_booleans: !input prioritize_load_booleans
  prioritize_below_soc: !input prioritize_below_soc
  deferrable_load_sensors: !input deferrable_load_sensors
  session_lock: !input session_lock
  session_start_soc: !input session_start_soc
  restart_soc_hysteresis: !input restart_soc_hysteresis
  last_ramp_up_at: !input last_ramp_up_at
  start_verify_seconds: !input start_verify_seconds
  session_min_gain_for_notify: !input session_min_gain_for_notify
  home_battery_soc: !input home_battery_soc
  home_battery_reserve_soc: !input home_battery_reserve_soc
  boost_session_lock: !input boost_session_lock

trigger:
  # Main controller evaluator: runs every minute, on HA start, and on
  # any meaningful state change. Drives ramp-up / ramp-down / start /
  # SOC-cap stop / window-end stop / below-minimum flag handling.
  - platform: homeassistant
    event: start
    id: tick
  - platform: time_pattern
    minutes: "/1"
    id: tick
  - platform: state
    entity_id: !input grid_export_power_negative
    id: tick
  - platform: state
    entity_id: !input grid_import_power
    id: tick
  - platform: state
    entity_id: !input contactor_closed
    id: tick
  - platform: state
    entity_id: !input vehicle_connected
    id: tick
  - platform: state
    entity_id: !input wall_connector_status
    id: tick
  - platform: state
    entity_id: !input battery_soc
    id: tick
  # Wall-connector power and the charge-current number entity also
  # drive ticks so the controller reacts immediately when the car's
  # draw changes (clouds, appliance spikes, ramp settling) instead
  # of waiting for the next grid-meter update.
  - platform: state
    entity_id: !input wall_connector_power
    id: tick
  - platform: state
    entity_id: !input charge_current_number
    id: tick

  # Grace stop: if the below-minimum flag stays on for the full grace
  # window, the session is ended. If export recovers before then, the
  # tick branch clears the flag and this trigger silently aborts.
  - platform: state
    entity_id: !input below_min_flag
    to: "on"
    for:
      seconds: !input stop_grace_seconds
    id: grace_expired

  # Startup reconciliation: clear a stale below-minimum flag if no
  # session is running. The "for:" on grace_expired above does not
  # fire for transitions that happened before HA restarted.
  - platform: homeassistant
    event: start
    id: ha_start_reconcile

  # Import-spike trim: any change to grid import re-evaluates whether
  # we need to ramp down immediately. The action filters on the
  # configured threshold, and parallel-run flooding is bounded by
  # mode: parallel / max / max_exceeded: silent at the top of the
  # automation. A numeric_state edge trigger was tried but only
  # fires once per rising crossing, so a partial trim that left
  # import above the threshold would never re-fire — causing the
  # car to keep pulling from grid until the next per-minute tick.
  - platform: state
    entity_id: !input grid_import_power
    id: import_spike

  # Lifecycle notifications. Each lifecycle trigger is duplicated
  # with id: tick so the controller re-evaluates immediately
  # instead of waiting up to 60 s for the next per-minute tick —
  # plug in, enable, and the session starts within seconds.
  - platform: state
    entity_id: !input vehicle_connected
    to: "on"
    for:
      seconds: 2
    id: plugged_in
  - platform: state
    entity_id: !input vehicle_connected
    to: "on"
    for:
      seconds: 2
    id: tick
  - platform: state
    entity_id: !input enable_toggle
    from: "off"
    to: "on"
    id: enabled
  - platform: state
    entity_id: !input enable_toggle
    from: "off"
    to: "on"
    id: tick
  - platform: state
    entity_id: !input enable_toggle
    from: "on"
    to: "off"
    id: disabled

  # Vehicle unplugged: restore any prioritize-loads the controller
  # disabled during the session, so loads like AC don't stay off
  # after the car leaves the charger mid-window. Debounced 10 s to
  # ride out brief connector flaps (integration reloads, Wi-Fi
  # blips) that would otherwise restore loads mid-session and let
  # them run for a tick before being paused again.
  - platform: state
    entity_id: !input vehicle_connected
    to: "off"
    for:
      seconds: 10
    id: unplugged

  # Window close: restore any prioritize-loads the controller
  # disabled during the session.
  - platform: time
    at: !input window_end
    id: window_close

  # Session ended: contactor goes from on to off and stays off for
  # at least 10 s. Used to clear the optional session_lock so a
  # future start can fire if the previous session ended naturally
  # (e.g. car-side stop, fault, unplug) without an explicit branch
  # clearing the lock. The 10 s debounce ignores brief contactor
  # flicker during start sequences.
  - platform: state
    entity_id: !input contactor_closed
    from: "on"
    to: "off"
    for:
      seconds: 10
    id: session_ended

action:
  - choose:
      # ─────────────────────────────────────────────────────────────
      # GRACE EXPIRED: end session after grace period at minimum.
      # ─────────────────────────────────────────────────────────────
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'grace_expired' }}"
          - condition: state
            entity_id: !input enable_toggle
            state: "on"
          - condition: state
            entity_id: !input below_min_flag
            state: "on"
          - condition: state
            entity_id: !input contactor_closed
            state: "on"
        sequence:
          - service: switch.turn_off
            target:
              entity_id: !input charge_switch
          - service: input_boolean.turn_off
            target:
              entity_id: !input below_min_flag
          - if:
              - condition: template
                value_template: >
                  {{ boost_session_lock | length > 0
                     and is_state(boost_session_lock, 'on') }}
            then:
              - service: input_boolean.turn_off
                target:
                  entity_id: "{{ boost_session_lock }}"
          - variables:
              now_soc_val: "{{ states(battery_soc) | float(0) }}"
              start_soc_val: >
                {{ states(session_start_soc) | float(0)
                   if session_start_soc else 0 }}
              gain_pts: "{{ now_soc_val - start_soc_val }}"
              notify_session_end: >
                {{ start_soc_val == 0
                   or gain_pts >= (session_min_gain_for_notify | float(0)) }}
              delta_suffix: >
                {%- if start_soc_val > 0 and now_soc_val > start_soc_val %}
                Charged from {{ start_soc_val | round(0) | int }}%
                (+{{ (now_soc_val - start_soc_val) | round(0) | int }}%).
                {%- endif %}
          - if:
              - condition: template
                value_template: >
                  {{ notify_service | length > 0 and notify_session_end }}
            then:
              - service: "{{ notify_service }}"
                data:
                  title: "☁️ Solar Session Ended"
                  message: >
                    Solar export stayed below minimum for
                    {{ (stop_grace_seconds | int // 60) }} min.
                    Charging stopped at
                    {{ states(battery_soc) | round(0) }}%.
                    {{ delta_suffix }}

      # ─────────────────────────────────────────────────────────────
      # HA START RECONCILE: clear any stale stateful flags if no
      # session is live. Runs regardless of enable_toggle /
      # vehicle_connected so leftovers from before the restart
      # never get stuck on. Handles both the below-minimum tracker
      # and the optional session start lock.
      # ─────────────────────────────────────────────────────────────
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'ha_start_reconcile' }}"
          - condition: state
            entity_id: !input contactor_closed
            state: "off"
        sequence:
          - if:
              - condition: state
                entity_id: !input below_min_flag
                state: "on"
            then:
              - service: input_boolean.turn_off
                target:
                  entity_id: !input below_min_flag
          - if:
              - condition: template
                value_template: >
                  {{ session_lock | length > 0
                     and is_state(session_lock, 'on') }}
            then:
              - service: input_boolean.turn_off
                target:
                  entity_id: "{{ session_lock }}"
          - if:
              - condition: template
                value_template: >
                  {{ boost_session_lock | length > 0
                     and is_state(boost_session_lock, 'on') }}
            then:
              - service: input_boolean.turn_off
                target:
                  entity_id: "{{ boost_session_lock }}"

      # ─────────────────────────────────────────────────────────────
      # IMPORT-SPIKE TRIM: instantly ramp current down if any grid
      # import is detected above the noise threshold. Ramps down
      # only; never stops the session (the tick branch owns stops).
      # ─────────────────────────────────────────────────────────────
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'import_spike' }}"
          - condition: state
            entity_id: !input enable_toggle
            state: "on"
          - condition: state
            entity_id: !input contactor_closed
            state: "on"
          - condition: template
            value_template: >
              {{ states(grid_import_power) | float(0) > import_threshold_w }}
          - condition: template
            value_template: >
              {{ (states(charge_current_number) | int)
                 > (min_charge_amps_cfg | int) }}
        sequence:
          - variables:
              import_w: "{{ states(grid_import_power) | float(0) }}"
              # Deferrable loads (solar diverters etc.) that back off
              # automatically as the Tesla draws more. While they're
              # still consuming above the spike, the import is
              # "borrowed" PV and the load will yield within seconds;
              # no Tesla trim is needed.
              deferrable_load_w: >
                {% set ns = namespace(total=0.0) %}
                {% for e in deferrable_load_sensors %}
                  {% set raw = states(e) | float(none) %}
                  {% if raw is not none and raw > 0 %}
                    {% set unit = state_attr(e, 'unit_of_measurement')
                                  | default('W', true) | lower %}
                    {% set w = (raw * 1000) if 'kw' in unit else raw %}
                    {% set ns.total = ns.total + w %}
                  {% endif %}
                {% endfor %}
                {{ ns.total }}
              effective_import_w: >
                {{ [import_w - (deferrable_load_w | float(0)), 0] | max }}
              current_set_amps: "{{ states(charge_current_number) | float(0) }}"
              min_amps: "{{ [min_charge_amps_cfg, 1] | max }}"
              # 230 V * 3 phases = 690 W per 1 A of charge current.
              watts_per_amp: "{{ line_voltage * phase_count }}"
              # Ceiling division covers the fractional amp; the
              # safety margin adds any further cushion (default 0).
              reduce_by: >
                {{ ((effective_import_w / watts_per_amp) | round(0, 'ceil') | int)
                   + (import_safety_margin_amps | int) }}
              reduced_amps: >
                {{ [(current_set_amps | int) - reduce_by,
                    (min_amps | int)] | max }}
          # Skip the trim entirely if the spike is fully covered by
          # deferrable loads that are expected to back off.
          - if:
              - condition: template
                value_template: >
                  {{ effective_import_w > (import_threshold_w | float(0)) }}
            then:
              # Stamp the trim timestamp FIRST so under heavy sensor
              # chatter the controller still sees a recent trim marker
              # even if number.set_value below is preempted.
              - if:
                  - condition: template
                    value_template: "{{ last_guard_trim | length > 0 }}"
                then:
                  - service: input_datetime.set_datetime
                    target:
                      entity_id: "{{ last_guard_trim }}"
                    data:
                      datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
              - service: number.set_value
                target:
                  entity_id: !input charge_current_number
                data:
                  value: "{{ reduced_amps }}"

      # ─────────────────────────────────────────────────────────────
      # PLUGGED IN: notify based on whether solar charging is armed.
      # ─────────────────────────────────────────────────────────────
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'plugged_in' }}"
          - condition: template
            value_template: "{{ notify_service | length > 0 }}"
        sequence:
          - choose:
              - conditions:
                  - condition: state
                    entity_id: !input enable_toggle
                    state: "off"
                sequence:
                  - service: "{{ notify_service }}"
                    data:
                      title: "🔌 Tesla Plugged In"
                      message: >
                        Tesla plugged in but solar charging is disabled.
                        Window: {{ states(window_start) }} to {{ states(window_end) }}.
            default:
              - service: "{{ notify_service }}"
                data:
                  title: "☀️ Solar Charging Armed"
                  message: >
                    Tesla plugged in; solar charging will run during the
                    window ({{ states(window_start) }} to {{ states(window_end) }}).

      # ─────────────────────────────────────────────────────────────
      # ENABLED while already plugged in: confirm.
      # ─────────────────────────────────────────────────────────────
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'enabled' }}"
          - condition: state
            entity_id: !input vehicle_connected
            state: "on"
          - condition: template
            value_template: "{{ notify_service | length > 0 }}"
        sequence:
          - service: "{{ notify_service }}"
            data:
              title: "☀️ Solar Charging Enabled"
              message: >
                Solar charging enabled with Tesla already plugged in.
                Window: {{ states(window_start) }} to {{ states(window_end) }}.

      # ─────────────────────────────────────────────────────────────
      # WINDOW CLOSE: restore prioritize-loads that are currently off.
      # Runs regardless of enable_toggle so loads never get stuck off
      # if the user disabled the controller mid-window.
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'window_close' }}"
          - condition: template
            value_template: "{{ prioritize_load_booleans | length > 0 }}"
        sequence:
          - variables:
              prioritize_off_loads: >
                {% set ns = namespace(items=[]) %}
                {% for e in prioritize_load_booleans %}
                  {% if states(e) == 'off' %}
                    {% set ns.items = ns.items + [e] %}
                  {% endif %}
                {% endfor %}
                {{ ns.items }}
          - if:
              - condition: template
                value_template: "{{ prioritize_off_loads | length > 0 }}"
            then:
              - service: input_boolean.turn_on
                target:
                  entity_id: "{{ prioritize_off_loads }}"

      # ─────────────────────────────────────────────────────────────
      # UNPLUGGED: vehicle disconnected from the charger. Restore any
      # prioritize-loads (e.g. AC) the controller paused during the
      # session so they don't stay off until window close, and clear
      # the session start lock if it was claimed but the contactor
      # never closed (e.g. unplugged during the 15 s wake delay).
      # Runs regardless of enable_toggle so loads recover even if the
      # controller was disabled while the car was still plugged in.
      # ─────────────────────────────────────────────────────────────
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'unplugged' }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ prioritize_load_booleans | length > 0 }}"
            then:
              - variables:
                  prioritize_off_loads: >
                    {% set ns = namespace(items=[]) %}
                    {% for e in prioritize_load_booleans %}
                      {% if states(e) == 'off' %}
                        {% set ns.items = ns.items + [e] %}
                      {% endif %}
                    {% endfor %}
                    {{ ns.items }}
              - if:
                  - condition: template
                    value_template: "{{ prioritize_off_loads | length > 0 }}"
                then:
                  - service: input_boolean.turn_on
                    target:
                      entity_id: "{{ prioritize_off_loads }}"
          - if:
              - condition: template
                value_template: >
                  {{ session_lock | length > 0
                     and is_state(session_lock, 'on')
                     and is_state(contactor_closed, 'off') }}
            then:
              - service: input_boolean.turn_off
                target:
                  entity_id: "{{ session_lock }}"
          - if:
              - condition: template
                value_template: >
                  {{ boost_session_lock | length > 0
                     and is_state(boost_session_lock, 'on') }}
            then:
              - service: input_boolean.turn_off
                target:
                  entity_id: "{{ boost_session_lock }}"

      # DISABLED mid-session: stop the charger. The per-minute tick
      # branch is gated on enable_toggle == on, so without an
      # explicit stop here a running session would continue until
      # the car-side limit, an unplug, or a manual switch-off.
      # ─────────────────────────────────────────────────────────────
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'disabled' }}"
          - condition: state
            entity_id: !input contactor_closed
            state: "on"
        sequence:
          - service: switch.turn_off
            target:
              entity_id: !input charge_switch
          - service: input_boolean.turn_off
            target:
              entity_id: !input below_min_flag
          # Restore any prioritize-loads the controller paused.
          - if:
              - condition: template
                value_template: "{{ prioritize_load_booleans | length > 0 }}"
            then:
              - variables:
                  prioritize_off_loads: >
                    {% set ns = namespace(items=[]) %}
                    {% for e in prioritize_load_booleans %}
                      {% if states(e) == 'off' %}
                        {% set ns.items = ns.items + [e] %}
                      {% endif %}
                    {% endfor %}
                    {{ ns.items }}
              - if:
                  - condition: template
                    value_template: "{{ prioritize_off_loads | length > 0 }}"
                then:
                  - service: input_boolean.turn_on
                    target:
                      entity_id: "{{ prioritize_off_loads }}"
          - if:
              - condition: template
                value_template: "{{ notify_service | length > 0 }}"
            then:
              - variables:
                  now_soc_val: "{{ states(battery_soc) | float(0) }}"
                  start_soc_val: >
                    {{ states(session_start_soc) | float(0)
                       if session_start_soc else 0 }}
                  delta_suffix: >
                    {%- if start_soc_val > 0 and now_soc_val > start_soc_val %}
                    Charged from {{ start_soc_val | round(0) | int }}%
                    (+{{ (now_soc_val - start_soc_val) | round(0) | int }}%).
                    {%- endif %}
              - service: "{{ notify_service }}"
                data:
                  title: "⏹️ Solar Charging Stopped"
                  message: >
                    Master toggle disabled mid-session. Charging
                    stopped at {{ now_soc_val | round(0) | int }}%.
                    {{ delta_suffix }}

      # ─────────────────────────────────────────────────────────────
      # DISABLED before contactor closed: clear the optional
      # session_lock if it was claimed during the start branch but
      # the contactor never closed (e.g. user toggled enable off
      # during the 15 s wake delay). Without this, the lock stays
      # ON indefinitely and blocks future starts until HA restart.
      # Also clear the optional boost session lock for the same
      # reason — Branch 5 claims it before the wake delay.
      # ─────────────────────────────────────────────────────────────
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'disabled' }}"
          - condition: state
            entity_id: !input contactor_closed
            state: "off"
        sequence:
          - if:
              - condition: template
                value_template: >
                  {{ session_lock | length > 0
                     and is_state(session_lock, 'on') }}
            then:
              - service: input_boolean.turn_off
                target:
                  entity_id: "{{ session_lock }}"
          - if:
              - condition: template
                value_template: >
                  {{ boost_session_lock | length > 0
                     and is_state(boost_session_lock, 'on') }}
            then:
              - service: input_boolean.turn_off
                target:
                  entity_id: "{{ boost_session_lock }}"

      # ─────────────────────────────────────────────────────────────
      # SESSION ENDED: contactor opened and stayed open 10 s.
      # Clears the optional session_lock so a future start can
      # fire after a natural session end (car-side stop, fault,
      # unplug) that wasn't terminated by an explicit branch.
      # ─────────────────────────────────────────────────────────────
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'session_ended' }}"
        sequence:
          - if:
              - condition: template
                value_template: >
                  {{ session_lock | length > 0
                     and is_state(session_lock, 'on') }}
            then:
              - service: input_boolean.turn_off
                target:
                  entity_id: "{{ session_lock }}"
          - if:
              - condition: template
                value_template: >
                  {{ boost_session_lock | length > 0
                     and is_state(boost_session_lock, 'on') }}
            then:
              - service: input_boolean.turn_off
                target:
                  entity_id: "{{ boost_session_lock }}"

      # ─────────────────────────────────────────────────────────────
      # TICK: main ramp / start / SOC-cap / window-end evaluator.
      # ─────────────────────────────────────────────────────────────
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'tick' }}"
          - condition: state
            entity_id: !input enable_toggle
            state: "on"
          - condition: state
            entity_id: !input vehicle_connected
            state: "on"
          - condition: template
            value_template: >
              {% set bad = ['unavailable', 'unknown', 'none', ''] %}
              {{ states(grid_export_power_negative) | lower not in bad
                 and states(grid_import_power) | lower not in bad
                 and states(wall_connector_power) | lower not in bad
                 and states(contactor_closed) | lower not in bad
                 and states(battery_soc) | lower not in bad
                 and states(charge_current_number) | lower not in bad
                 and states(charge_switch) | lower not in bad }}
        sequence:
          - variables:
              # Wall connector power → watts.
              wall_power_raw: "{{ states(wall_connector_power) | float(0) }}"
              wall_power_unit: >
                {{ state_attr(wall_connector_power, 'unit_of_measurement')
                   | default('W', true) | lower }}
              wall_power_w: >
                {{ (wall_power_raw * 1000) if 'kw' in wall_power_unit
                   else wall_power_raw }}
              # Effective export (W) adds back the charger's own draw.
              # Net grid = import (>=0) + export_negative (<=0).
              # Negative net = exporting; flip sign so grid_export_w
              # is positive when exporting.
              grid_export_w: >
                {{ -((states(grid_import_power) | float(0))
                     + (states(grid_export_power_negative) | float(0))) }}
              # Deferrable loads (solar diverters etc.) that back off
              # as the Tesla draws more. Sum positive readings, honour
              # W vs kW per sensor, skip any unavailable entity.
              deferrable_load_w: >
                {% set ns = namespace(total=0.0) %}
                {% for e in deferrable_load_sensors %}
                  {% set raw = states(e) | float(none) %}
                  {% if raw is not none and raw > 0 %}
                    {% set unit = state_attr(e, 'unit_of_measurement')
                                  | default('W', true) | lower %}
                    {% set w = (raw * 1000) if 'kw' in unit else raw %}
                    {% set ns.total = ns.total + w %}
                  {% endif %}
                {% endfor %}
                {{ ns.total }}
              # Only the solar-fed portion of the deferrable load is
              # reclaimable; anything currently grid-fed wouldn't free
              # up if the load backed off.
              import_now_w: "{{ [states(grid_import_power) | float(0), 0] | max }}"
              reclaimable_deferrable_w: >
                {{ [(deferrable_load_w | float(0)) - import_now_w, 0] | max }}
              effective_export_w: >
                {{ grid_export_w + wall_power_w + reclaimable_deferrable_w }}
              effective_export_a: >
                {{ (effective_export_w / line_voltage)
                   if effective_export_w > 0 else 0 }}
              # House-battery reserve: when a home battery SOC sensor
              # is configured and the battery is below its reserve,
              # the Tesla yields the export entirely so the inverter
              # can refill the battery first. Unavailable sensor =>
              # treat as no reserve gate (fail-open; otherwise a flaky
              # sensor would silently stop the Tesla from ever
              # charging).
              home_battery_soc_val: >
                {% if home_battery_soc
                   and states(home_battery_soc) | lower
                       not in ['unavailable', 'unknown', 'none', ''] %}
                  {{ states(home_battery_soc) | float(100) }}
                {% else %}
                  100
                {% endif %}
              home_battery_blocks_tesla: >
                {{ home_battery_soc
                   and (home_battery_reserve_soc | float(0)) > 0
                   and home_battery_soc_val < (home_battery_reserve_soc | float(0)) }}
              available_amps: >
                {% if home_battery_blocks_tesla %}
                  0
                {% else %}
                  {% set a = (effective_export_a / phase_count) - export_threshold_amps %}
                  {{ [[a, 0] | max, max_charge_amps_cfg] | min | round(1) }}
                {% endif %}
              min_charge_amps: "{{ [min_charge_amps_cfg, 1] | max }}"
              max_charge_amps: >
                {{ [[state_attr(charge_current_number, 'max') | float(max_charge_amps_cfg),
                     max_charge_amps_cfg] | min,
                    min_charge_amps_cfg] | max }}
              # Restart threshold clamped to max_charge_amps so a
              # misconfigured (min + hysteresis) > max doesn't make
              # Branch 5 permanently un-startable.
              restart_charge_amps: >
                {{ [min_charge_amps + restart_hysteresis_amps,
                    max_charge_amps] | min }}
              current_set_amps: "{{ states(charge_current_number) | float(0) }}"
              status_text: "{{ states(wall_connector_status) | lower }}"
              # 'unknown', 'unavailable' and 'asleep' are deliberately
              # NOT blockers; we try to wake the car instead.
              blocking_statuses: "{{ ['fault', 'faulted', 'error', 'offline'] }}"
              soc: "{{ states(battery_soc) | float(0) }}"
              tesla_limit: >
                {% if charge_limit_number %}
                  {{ states(charge_limit_number) | float(max_soc) }}
                {% else %}
                  {{ max_soc }}
                {% endif %}
              # ── Solcast forecast boost ─────────────────────────
              # Active when today's forecast is "sunny" AND every
              # inspected upcoming day is "bad". Lookahead is capped
              # by how many sensors you configured, in order; any
              # gap stops the lookahead. Any unavailable upcoming
              # reading disables the boost (fail-safe).
              forecast_bad_values: "{{ ['unavailable', 'unknown', 'none', ''] }}"
              # Explicit health gate: boost is disabled outright if
              # either the "today" or "+1 day" Solcast sensors are
              # missing or reporting unavailable/unknown. The deeper
              # checks below remain as a safety net.
              solcast_healthy: >
                {{ solcast_today_kwh
                   and solcast_tomorrow_kwh
                   and states(solcast_today_kwh) | lower not in forecast_bad_values
                   and states(solcast_tomorrow_kwh) | lower not in forecast_bad_values }}
              solcast_today_val: >
                {% if solcast_today_kwh
                   and states(solcast_today_kwh) | lower not in forecast_bad_values %}
                  {{ states(solcast_today_kwh) | float(-1) }}
                {% else %}
                  -1
                {% endif %}
              forecast_upcoming_sensors: >
                {% set all_upcoming = [solcast_tomorrow_kwh,
                                       solcast_day_3_kwh,
                                       solcast_day_4_kwh,
                                       solcast_day_5_kwh,
                                       solcast_day_6_kwh,
                                       solcast_day_7_kwh] %}
                {% set ns = namespace(sensors=[], stop=false) %}
                {% for s in all_upcoming %}
                  {% if not ns.stop %}
                    {% if s %}
                      {% set ns.sensors = ns.sensors + [s] %}
                    {% else %}
                      {% set ns.stop = true %}
                    {% endif %}
                  {% endif %}
                {% endfor %}
                {{ ns.sensors[:boost_lookahead_days | int] }}
              forecast_upcoming_vals: >
                {% set ns = namespace(vals=[]) %}
                {% for s in forecast_upcoming_sensors %}
                  {% if states(s) | lower not in forecast_bad_values %}
                    {% set ns.vals = ns.vals + [states(s) | float(-1)] %}
                  {% endif %}
                {% endfor %}
                {{ ns.vals }}
              boost_active_live: >
                {{ boost_soc > max_soc
                   and solcast_healthy
                   and solcast_today_val >= boost_today_min_kwh
                   and forecast_upcoming_sensors | length > 0
                   and forecast_upcoming_vals | length
                       == forecast_upcoming_sensors | length
                   and forecast_upcoming_vals | max <= boost_bad_day_max_kwh }}
              # Snapshot: while the optional boost_session_lock is ON
              # (latched at start of a boosted session), the boost
              # stays active for the rest of the session even if the
              # live forecast flips off mid-day. This prevents the
              # cap from dropping below the live SOC mid-charge.
              boost_locked: >
                {{ boost_session_lock | length > 0
                   and is_state(boost_session_lock, 'on') }}
              boost_active: "{{ boost_active_live or boost_locked }}"
              preferred_cap: "{{ boost_soc if boost_active else max_soc }}"
              effective_limit: "{{ [preferred_cap, tesla_limit] | min }}"
              now_time: "{{ now().strftime('%H:%M:%S') }}"
              window_start_str: "{{ states(window_start) }}"
              window_end_str: "{{ states(window_end) }}"
              # Window is open when now is inside [start, end). If end
              # is earlier than start the window wraps across midnight
              # (e.g. start 22:00, end 06:00) and is open when now is
              # at/after start OR before end.
              window_open: >
                {% if window_start_str <= window_end_str %}
                  {{ window_start_str <= now_time < window_end_str }}
                {% else %}
                  {{ now_time >= window_start_str or now_time < window_end_str }}
                {% endif %}
              flag_on: "{{ is_state(below_min_flag, 'on') }}"
              seconds_since_guard_trim: >
                {% if last_guard_trim %}
                  {% set ts = state_attr(last_guard_trim, 'timestamp') %}
                  {% if ts is not none %}
                    {{ now().timestamp() - (ts | float(0)) }}
                  {% else %}
                    99999
                  {% endif %}
                {% else %}
                  99999
                {% endif %}
              guard_trim_recent: >
                {{ seconds_since_guard_trim | float(99999)
                   < post_trim_fast_recovery_seconds }}
              # Start-SOC tracker for end-of-session summaries.
              # Reads the optional helper; falls back to 0 when not
              # configured or unset.
              start_soc_val: >
                {{ states(session_start_soc) | float(0)
                   if session_start_soc else 0 }}
              delta_suffix: >
                {%- if start_soc_val > 0 and soc > start_soc_val %}
                Charged from {{ start_soc_val | round(0) | int }}%
                (+{{ (soc - start_soc_val) | round(0) | int }}%).
                {%- endif %}
              # ── Stop-side SOC hysteresis ────────────────────
              # Bar restart until SOC has drained this many points
              # below the cap (default 2 %). Prevents tiny
              # post-cap relaunches from Tesla vampire drain.
              restart_soc_threshold: >
                {{ [effective_limit - (restart_soc_hysteresis | float(0)), 0] | max }}
              # ── Ramp-up rate limiter ────────────────────────
              # When the optional last_ramp_up_at helper is set,
              # ramp-up steps in Branch 6 are gated on elapsed
              # time so the parallel-execution model can't bypass
              # the stability delay by spawning a fresh run on
              # every state-change tick. Skipped during the
              # post-trim fast-recovery window.
              seconds_since_ramp_up: >
                {% if last_ramp_up_at %}
                  {% set ts = state_attr(last_ramp_up_at, 'timestamp') %}
                  {% if ts is not none %}
                    {{ now().timestamp() - (ts | float(0)) }}
                  {% else %}
                    99999
                  {% endif %}
                {% else %}
                  99999
                {% endif %}
              # ── Grid-data freshness guard ───────────────────
              # wall_connector_power is one of the tick triggers, so
              # a rising car draw re-evaluates the controller almost
              # instantly. If the grid import/export sensors haven't
              # refreshed since that draw increase, effective_export_w
              # (grid + wall power added back) double-counts the
              # amps the car just picked up, inflating available_amps
              # and triggering yet another ramp-up before the meter
              # ever reflects the previous one — a runaway ratchet
              # straight to max_charge_amps, followed by a hard
              # import-spike trim once the meter catches up. Block
              # ramp-ups while the wall connector's own reading is
              # meaningfully newer than the grid readings so each
              # step is judged against grid data that actually
              # reflects it.
              grid_data_fresh: >
                {% set grid_ts = [states[grid_import_power].last_updated,
                                   states[grid_export_power_negative].last_updated]
                                  | max %}
                {% set wall_ts = states[wall_connector_power].last_updated %}
                {{ (wall_ts - grid_ts).total_seconds() <= 5 }}
              ramp_up_allowed: >
                {{ (guard_trim_recent
                    or (last_ramp_up_at | length == 0)
                    or (seconds_since_ramp_up | float(99999)
                        >= stability_delay_seconds))
                   and grid_data_fresh }}
              # ── Notification gain gate ──────────────────────
              # Suppress session-end notifications when the
              # session didn't move SOC by at least this much.
              # Avoids notification storms on cloudy days where
              # the controller cycles repeatedly without
              # meaningful progress.
              notify_session_end: >
                {{ start_soc_val == 0
                   or (soc - start_soc_val)
                      >= (session_min_gain_for_notify | float(0)) }}
              # ── Mid-session fault detection ─────────────────
              # If the wall connector reports a hard fault while
              # the contactor is closed, stop the session. Branch
              # 5 already blocks restarts on these statuses.
              mid_session_fault: >
                {{ is_state(contactor_closed, 'on')
                   and status_text in blocking_statuses }}
              # ── Stale session-lock self-heal ────────────────
              # Branch 5 claims session_lock (and boost_session_lock)
              # BEFORE the wake delay / start-verify wait, then rolls
              # them back if the contactor never closes. If that run
              # is interrupted mid-flight (e.g. HA/automation reload
              # while the wait was in progress) the rollback never
              # executes and the lock is stranded ON, permanently
              # blocking future starts — the only other clears are
              # tied to specific events (unplug, disable, session end)
              # that may never fire. Treat the lock as stale once it's
              # been ON for longer than the worst-case legitimate
              # start sequence could ever take, and clear it here so
              # this same tick can still fall through to Branch 5.
              session_lock_age_s: >
                {% if session_lock and is_state(session_lock, 'on') %}
                  {{ (now() - states[session_lock].last_changed).total_seconds() }}
                {% else %}
                  0
                {% endif %}
              session_lock_stale: >
                {{ session_lock | length > 0
                   and is_state(session_lock, 'on')
                   and is_state(contactor_closed, 'off')
                   and session_lock_age_s | float(0)
                      > ((start_verify_seconds | int) + 60) }}
          - if:
              - condition: template
                value_template: "{{ session_lock_stale }}"
            then:
              - service: input_boolean.turn_off
                target:
                  entity_id: "{{ session_lock }}"
              - if:
                  - condition: template
                    value_template: >
                      {{ boost_session_lock | length > 0
                         and is_state(boost_session_lock, 'on') }}
                then:
                  - service: input_boolean.turn_off
                    target:
                      entity_id: "{{ boost_session_lock }}"
          # Prioritize Tesla: if SOC is low during the charging
          # window, turn off the configured load booleans so the
          # Tesla gets priority on solar export. Filtered to loads
          # currently ON to keep the logbook clean. The window_close
          # and unplugged triggers, and the SOC-cap branch, restore
          # them.
          - if:
              - condition: template
                value_template: >
                  {{ prioritize_load_booleans | length > 0
                     and window_open
                     and soc < prioritize_below_soc }}
            then:
              - variables:
                  prioritize_on_loads: >
                    {% set ns = namespace(items=[]) %}
                    {% for e in prioritize_load_booleans %}
                      {% if states(e) == 'on' %}
                        {% set ns.items = ns.items + [e] %}
                      {% endif %}
                    {% endfor %}
                    {{ ns.items }}
              - if:
                  - condition: template
                    value_template: "{{ prioritize_on_loads | length > 0 }}"
                then:
                  - service: input_boolean.turn_off
                    target:
                      entity_id: "{{ prioritize_on_loads }}"
                  - if:
                      - condition: template
                        value_template: "{{ notify_service | length > 0 }}"
                    then:
                      - service: "{{ notify_service }}"
                        data:
                          title: "⏸️ Loads Paused for Tesla"
                          message: >
                            Paused {{ prioritize_on_loads | join(', ') }}
                            for Tesla priority (SOC {{ soc | round(0) }}%,
                            threshold {{ prioritize_below_soc | round(0) }}%).
          - choose:
              # ── Branch 0: Mid-session wall-connector fault ─────
              # If the wall connector reports a hard fault while
              # the contactor is closed, stop immediately. Branch
              # 5 already blocks restarts on these statuses.
              - conditions:
                  - condition: template
                    value_template: "{{ mid_session_fault }}"
                sequence:
                  - service: switch.turn_off
                    target:
                      entity_id: !input charge_switch
                  - service: input_boolean.turn_off
                    target:
                      entity_id: !input below_min_flag
                  - if:
                      - condition: template
                        value_template: >
                          {{ boost_session_lock | length > 0
                             and is_state(boost_session_lock, 'on') }}
                    then:
                      - service: input_boolean.turn_off
                        target:
                          entity_id: "{{ boost_session_lock }}"
                  - if:
                      - condition: template
                        value_template: "{{ notify_service | length > 0 }}"
                    then:
                      - service: "{{ notify_service }}"
                        data:
                          title: "⚠️ Wall Connector Fault"
                          message: >
                            Wall connector reported "{{ status_text }}"
                            mid-session. Stopped at {{ soc | round(0) }}%.

              # ── Branch 1: SOC cap reached ──────────────────────
              - conditions:
                  - condition: template
                    value_template: >
                      {{ is_state(contactor_closed, 'on')
                         and soc >= effective_limit }}
                sequence:
                  - service: switch.turn_off
                    target:
                      entity_id: !input charge_switch
                  - service: input_boolean.turn_off
                    target:
                      entity_id: !input below_min_flag
                  # Release the optional boost session lock so the
                  # next session re-evaluates the live forecast.
                  - if:
                      - condition: template
                        value_template: >
                          {{ boost_session_lock | length > 0
                             and is_state(boost_session_lock, 'on') }}
                    then:
                      - service: input_boolean.turn_off
                        target:
                          entity_id: "{{ boost_session_lock }}"
                  # Tesla is done charging for the day, so restore any
                  # prioritize-loads we paused earlier in the window.
                  - if:
                      - condition: template
                        value_template: "{{ prioritize_load_booleans | length > 0 }}"
                    then:
                      - variables:
                          prioritize_off_loads: >
                            {% set ns = namespace(items=[]) %}
                            {% for e in prioritize_load_booleans %}
                              {% if states(e) == 'off' %}
                                {% set ns.items = ns.items + [e] %}
                              {% endif %}
                            {% endfor %}
                            {{ ns.items }}
                      - if:
                          - condition: template
                            value_template: "{{ prioritize_off_loads | length > 0 }}"
                        then:
                          - service: input_boolean.turn_on
                            target:
                              entity_id: "{{ prioritize_off_loads }}"
                  - if:
                      - condition: template
                        value_template: >
                          {{ notify_service | length > 0
                             and notify_session_end }}
                    then:
                      - service: "{{ notify_service }}"
                        data:
                          title: "🔋 Tesla Fully Charged (Solar)"
                          message: >
                            Tesla reached {{ soc | round(0) }}% (limit
                            {{ effective_limit | round(0) }}%{% if boost_active %},
                            forecast boost{% endif %}).
                            Solar charging stopped.
                            {{ delta_suffix }}

              # ── Branch 2: Hard stop at window end (optional) ───
              - conditions:
                  - condition: template
                    value_template: >
                      {{ hard_stop_at_window_end
                         and is_state(contactor_closed, 'on')
                         and not window_open }}
                sequence:
                  - service: switch.turn_off
                    target:
                      entity_id: !input charge_switch
                  - service: input_boolean.turn_off
                    target:
                      entity_id: !input below_min_flag
                  - if:
                      - condition: template
                        value_template: >
                          {{ boost_session_lock | length > 0
                             and is_state(boost_session_lock, 'on') }}
                    then:
                      - service: input_boolean.turn_off
                        target:
                          entity_id: "{{ boost_session_lock }}"
                  - if:
                      - condition: template
                        value_template: >
                          {{ notify_service | length > 0
                             and notify_session_end }}
                    then:
                      - service: "{{ notify_service }}"
                        data:
                          title: "⏱️ Solar Window Closed"
                          message: >
                            Charging window ended ({{ window_start_str }} to {{ window_end_str }}).
                            Solar session stopped at {{ soc | round(0) }}%.
                            {{ delta_suffix }}

              # Branch 3: Below minimum, hold at min, raise flag.
              # The grace_expired trigger ends the session if the
              # flag stays on through the grace window.
              - conditions:
                  - condition: template
                    value_template: >
                      {{ is_state(contactor_closed, 'on')
                         and available_amps < min_charge_amps }}
                sequence:
                  - if:
                      - condition: template
                        value_template: >
                          {{ (current_set_amps | int)
                             != (min_charge_amps | int) }}
                    then:
                      - service: number.set_value
                        target:
                          entity_id: !input charge_current_number
                        data:
                          value: "{{ min_charge_amps | round(0) | int }}"
                  - if:
                      - condition: template
                        value_template: "{{ not flag_on }}"
                    then:
                      - service: input_boolean.turn_on
                        target:
                          entity_id: !input below_min_flag

              # Branch 4: Recovered from below-minimum, clear flag.
              - conditions:
                  - condition: template
                    value_template: >
                      {{ flag_on
                         and (is_state(contactor_closed, 'off')
                              or available_amps >= min_charge_amps) }}
                sequence:
                  - service: input_boolean.turn_off
                    target:
                      entity_id: !input below_min_flag

              # ── Branch 5: Start / resume ───────────────────────
              - conditions:
                  - condition: template
                    value_template: >
                      {{ is_state(contactor_closed, 'off')
                         and window_open
                         and is_state(vehicle_connected, 'on')
                         and status_text not in blocking_statuses
                         and available_amps >= restart_charge_amps
                         and soc < restart_soc_threshold
                         and (session_lock | length == 0
                              or is_state(session_lock, 'off')) }}
                sequence:
                  - variables:
                      target_amps: >
                        {% set raw = [[available_amps, max_charge_amps] | min,
                                      min_charge_amps] | max %}
                        {{ raw | round(0, 'floor') | int }}
                  # Claim the session lock first so a re-entry of
                  # this branch during the wake/start sequence is
                  # blocked by the condition check above. No-op
                  # when the optional lock helper isn't configured.
                  - if:
                      - condition: template
                        value_template: "{{ session_lock | length > 0 }}"
                    then:
                      - service: input_boolean.turn_on
                        target:
                          entity_id: "{{ session_lock }}"
                  # Latch the optional boost session lock so the cap
                  # stays at the Boost SOC for the whole session
                  # even if the live forecast flips off mid-day.
                  - if:
                      - condition: template
                        value_template: >
                          {{ boost_session_lock | length > 0
                             and boost_active_live }}
                    then:
                      - service: input_boolean.turn_on
                        target:
                          entity_id: "{{ boost_session_lock }}"
                  # Capture this session's starting SOC for the
                  # end-of-session summary suffix. Overwritten on
                  # each Branch 5 entry, so the suffix reports
                  # "charged since last contactor close".
                  - if:
                      - condition: template
                        value_template: "{{ session_start_soc | length > 0 }}"
                    then:
                      - service: input_number.set_value
                        target:
                          entity_id: "{{ session_start_soc }}"
                        data:
                          value: "{{ soc | round(0, 'floor') | int }}"
                  # Always try to wake the car on a restart when a
                  # wake button is provided; covers the case where
                  # status is asleep or unknown (which would
                  # otherwise block resume).
                  - if:
                      - condition: template
                        value_template: "{{ wake_button | length > 0 }}"
                    then:
                      - service: button.press
                        target:
                          entity_id: "{{ wake_button }}"
                      - delay:
                          seconds: 15
                  - service: number.set_value
                    target:
                      entity_id: !input charge_current_number
                    data:
                      value: "{{ target_amps }}"
                  - delay:
                      seconds: 3
                  - service: switch.turn_on
                    target:
                      entity_id: !input charge_switch
                  - service: input_boolean.turn_off
                    target:
                      entity_id: !input below_min_flag
                  # Verify the start actually took: wait up to
                  # start_verify_seconds for the contactor to close.
                  # If it never does (silent API drop, car in a weird
                  # state), release the session lock and suppress
                  # the "Started" notification so a future tick can
                  # retry cleanly instead of stranding the lock ON.
                  - wait_template: "{{ is_state(contactor_closed, 'on') }}"
                    timeout:
                      seconds: "{{ start_verify_seconds | int }}"
                    continue_on_timeout: true
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ wait.completed | default(false) }}"
                        sequence:
                          - if:
                              - condition: template
                                value_template: "{{ notify_service | length > 0 }}"
                            then:
                              - service: "{{ notify_service }}"
                                data:
                                  title: "☀️ Solar Charging Started"
                                  message: >
                                    Session started at {{ target_amps }} A
                                    (SOC {{ soc | round(0) }}%, limit
                                    {{ effective_limit | round(0) }}%{% if boost_active %},
                                    forecast boost: today {{ solcast_today_val | round(1) }} kWh,
                                    next {{ forecast_upcoming_vals | length }}d at or below
                                    {{ boost_bad_day_max_kwh }} kWh{% endif %}).
                    default:
                      # Contactor never closed. Roll back the locks
                      # so the next tick can retry.
                      - if:
                          - condition: template
                            value_template: >
                              {{ session_lock | length > 0
                                 and is_state(session_lock, 'on') }}
                        then:
                          - service: input_boolean.turn_off
                            target:
                              entity_id: "{{ session_lock }}"
                      - if:
                          - condition: template
                            value_template: >
                              {{ boost_session_lock | length > 0
                                 and is_state(boost_session_lock, 'on') }}
                        then:
                          - service: input_boolean.turn_off
                            target:
                              entity_id: "{{ boost_session_lock }}"

              # ── Branch 6: Adjust while charging ────────────────
              # No window_open check here unless hard_stop_at_window_end
              # is on (Branch 2 handles that). Branches 1 and 3 take
              # precedence over this branch.
              - conditions:
                  - condition: template
                    value_template: >
                      {{ is_state(contactor_closed, 'on')
                         and available_amps >= min_charge_amps
                         and soc < effective_limit }}
                sequence:
                  - variables:
                      target_amps: >
                        {% set current = current_set_amps | int %}
                        {% set raw = [[available_amps, max_charge_amps] | min,
                                      min_charge_amps] | max | round(0, 'floor') | int %}
                        {% set headroom = raw - current %}
                        {% if headroom >= (fast_ramp_headroom_amps | int) %}
                          {{ raw }}
                        {% elif raw > current %}
                          {{ [raw, current + 1] | min }}
                        {% else %}
                          {{ raw }}
                        {% endif %}
                      is_ramp_up: >
                        {{ (target_amps | int) > (current_set_amps | int) }}
                      should_write: >
                        {{ target_amps | int != (current_set_amps | int)
                           and (not is_ramp_up or ramp_up_allowed) }}
                  - if:
                      - condition: template
                        value_template: "{{ should_write }}"
                    then:
                      - service: number.set_value
                        target:
                          entity_id: !input charge_current_number
                        data:
                          value: "{{ target_amps }}"
                      # Stamp the ramp-up timestamp so subsequent
                      # parallel runs honour the stability delay.
                      - if:
                          - condition: template
                            value_template: >
                              {{ is_ramp_up
                                 and last_ramp_up_at | length > 0 }}
                        then:
                          - service: input_datetime.set_datetime
                            target:
                              entity_id: "{{ last_ramp_up_at }}"
                            data:
                              datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
                      # Fallback for installs without the timestamp
                      # helper: hold this run for the stability
                      # delay so at least the originating trigger
                      # is single-shot. (Doesn't rate-limit other
                      # parallel runs — that's what the helper
                      # above is for.)
                      - if:
                          - condition: template
                            value_template: >
                              {{ is_ramp_up
                                 and not guard_trim_recent
                                 and last_ramp_up_at | length == 0 }}
                        then:
                          - delay:
                              seconds: "{{ stability_delay_seconds }}"
